<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lisa Voice</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div>
          <div class="brand-name">Lisa <span>VOICE</span></div>
          <div class="brand-subtitle">Codex 语音助手</div>
        </div>
      </div>
      <div class="window-actions">
        <button class="action-button" data-action="background"
                data-tooltip="最小化到后台" aria-label="最小化到后台">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 12h14"/>
          </svg>
          <span>后台</span>
        </button>
        <button class="action-button danger" data-action="exit"
                data-tooltip="退出 Lisa" aria-label="退出 Lisa">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18"/>
          </svg>
          <span>退出</span>
        </button>
      </div>
    </header>

    <section class="voice-card">
      <div class="avatar-column">
        <button class="voice-avatar" id="voice-button" aria-label="开始或结束录音">
          <img class="avatar-image" src="avatar.png" alt="">
          <span class="mic-badge">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 4a2.5 2.5 0 0 0-2.5 2.5V12a2.5 2.5 0 0 0 5 0V6.5A2.5 2.5 0 0 0 12 4Z"/>
              <path d="M7 11.5a5 5 0 0 0 10 0M12 16.5V20"/>
            </svg>
          </span>
          <span class="pulse-ring"></span>
        </button>
        <button class="avatar-picker" id="avatar-picker" type="button">更换头像</button>
      </div>
      <input id="avatar-file" type="file" accept="image/*" hidden>
      <div class="voice-copy">
        <div class="eyebrow">VOICE INPUT</div>
        <h1 id="status">待唤醒</h1>
        <p id="status-hint">说“Lisa”，或双击 Enter 手动说话</p>
        <div class="voice-visual">
          <div class="waveform" id="waveform" data-state="idle"></div>
        </div>
      </div>
    </section>

    <main class="conversation-card idle-locked" id="conversation-card">
      <div class="conversation-main">
      <div class="conversation-header">
        <div class="conversation-title">
          <span>最近对话</span>
          <span class="live-dot">LIVE</span>
        </div>
        <div class="conversation-controls">
          <button class="action-button inline-clear" data-action="clear"
                  data-tooltip="清空对话" aria-label="清空对话">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 7h16M9 7V4h6v3m-8 0 1 13h8l1-13M10 11v5m4-5v5"/>
            </svg>
            <span>清空</span>
          </button>
          <button class="toggle active" id="tts-toggle">
            <span class="toggle-dot"></span>朗读
          </button>
          <button class="toggle muted" id="stop-button">停止朗读</button>
        </div>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>

      <div class="idle-lock" id="idle-lock" role="status" aria-live="polite">
        <div class="idle-lock-visual" aria-hidden="true">
          <span class="wake-orbit outer"></span>
          <span class="wake-orbit inner"></span>
          <span class="wake-scan"></span>
          <div class="wake-bars">
            <i></i><i></i><i></i><i></i><i></i><i></i><i></i>
          </div>
        </div>
        <span class="idle-lock-eyebrow">VOICE WAKE</span>
        <strong>等待唤醒</strong>
        <p>说“Lisa”进入语音指令</p>
      </div>
      </div>

      <form class="composer" id="composer">
        <textarea
          id="text-input"
          rows="3"
          placeholder="输入指令，Enter 发送"
          aria-label="输入指令"
        ></textarea>
        <div class="composer-footer">
          <span>Enter 确认后发送 · Shift + Enter 换行</span>
          <button class="send-button" type="submit" aria-label="发送">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M12 19V5M6.5 10.5 12 5l5.5 5.5"/>
            </svg>
          </button>
        </div>
      </form>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
